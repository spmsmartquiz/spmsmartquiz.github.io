<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matematik Tingkatan 5 — Kertas 1 Set A | SPM Smart Quiz</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#eef4ff;color:#203047;margin:0}header{background:#294e97;color:white;padding:20px;text-align:center}main{max-width:740px;margin:20px auto;padding:0 12px}.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #dce4f0}.option{display:block;border:1px solid #cbd8ec;border-radius:10px;padding:13px;margin:9px 0;cursor:pointer}.option:has(input:checked){background:#e8f0ff;border-color:#294e97}button{background:#294e97;color:white;border:0;border-radius:10px;padding:13px 16px;font-weight:bold;cursor:pointer;margin:7px 5px 7px 0}button:disabled{opacity:.5}.wrong{border-left:4px solid #c64242;background:#fff2f0;padding:13px;margin:12px 0}.right{border-left:4px solid #27936b;background:#edfaf5;padding:13px;margin:12px 0}.muted{color:#667085}.explain{white-space:pre-wrap;line-height:1.6;background:#f3f6fb;padding:12px;border-radius:8px}a{color:#294e97}.progress{font-weight:bold}</style></head><body><header><h2>SPM Smart Quiz</h2><p>Matematik Tingkatan 5 • Kertas 1 • Set A</p></header><main><section class="card"><p>40 soalan objektif • 40 markah • 8 bab • Tiada had masa</p><p class="muted">Soalan latihan asli berasaskan KSSM Tingkatan 5, bukan soalan rasmi SPM. Jawapan dan jalan pengiraan dipaparkan selepas selesai.</p><a href="index.html#matematik5">← Kembali ke menu Matematik Tingkatan 5</a></section><section class="card" id="quiz"></section></main><script>const bank=[{"chapter": 1, "question": "y berubah secara langsung dengan x. Jika y = 9 apabila x = 3, cari y apabila x = 4.", "options": ["12", "18", "9", "15"], "correct": 0, "explanation": "y = kx. Pemalar k = 9/3 = 3. Maka y = 3 × 4 = 12.", "diagram": ""}, {"chapter": 1, "question": "y berubah secara langsung dengan kuasa dua x. Jika y = 27 apabila x = 3, cari y apabila x = 5.", "options": ["78", "75", "15", "72"], "correct": 1, "explanation": "y = kx²; k = 27/9 = 3. Apabila x = 5, y = 3 × 5² = 75.", "diagram": ""}, {"chapter": 1, "question": "y berubah secara songsang dengan x. Jika y = 8 apabila x = 3, cari y apabila x = 6.", "options": ["6", "8", "10", "4"], "correct": 3, "explanation": "y = k/x; k = xy = 3 × 8 = 24. Maka y = 24/6 = 4.", "diagram": ""}, {"chapter": 1, "question": "z berubah secara tercantum dengan x dan y. Jika z = 36 apabila x = 3 dan y = 4, cari z apabila x = 4 dan y = 5.", "options": ["45", "48", "63", "60"], "correct": 3, "explanation": "z = kxy; k = 36/(3 × 4) = 3. Jadi z = 3 × 4 × 5 = 60.", "diagram": ""}, {"chapter": 1, "question": "Diberi y ∝ x dan y = 12 apabila x = 4. Berapakah nilai x apabila y = 21?", "options": ["7", "8", "9", "6"], "correct": 0, "explanation": "k = 12/4 = 3. Daripada 21 = 3x, x = 7.", "diagram": ""}, {"chapter": 2, "question": "Diberi matriks A = [[2, 3], [4, 5]]. Cari jumlah semua unsur pada pepenjuru utama A.", "options": ["6", "9", "8", "7"], "correct": 3, "explanation": "Pepenjuru utama terdiri daripada 2 dan 5. Jumlah = 2+5 = 7.", "diagram": ""}, {"chapter": 2, "question": "Diberi A = [[2, 3], [4, 5]] dan B = [[1, 2], [3, 4]]. Cari unsur baris pertama lajur kedua bagi A + B.", "options": ["5", "6", "4", "7"], "correct": 0, "explanation": "Tambah unsur sepadan: 3 + 2 = 5.", "diagram": ""}, {"chapter": 2, "question": "Jika A = [[2, 3], [4, 5]], cari unsur baris kedua lajur pertama bagi 3A.", "options": ["15", "13", "12", "11"], "correct": 2, "explanation": "Darab setiap unsur A dengan 3. Unsur tersebut = 3 × 4 = 12.", "diagram": ""}, {"chapter": 2, "question": "Cari penentu bagi matriks [[3, 2], [1, 4]].", "options": ["14", "12", "8", "10"], "correct": 3, "explanation": "Penentu = ad − bc = (3 × 4) − (2 × 1) = 10.", "diagram": ""}, {"chapter": 2, "question": "Penyelesaian persamaan matriks [[2, 1], [1, 2]] [[x], [y]] = [[10], [11]] ialah", "options": ["x = 4, y = 3", "x = 4, y = 4", "x = 3, y = 5", "x = 3, y = 4"], "correct": 3, "explanation": "Persamaan: 2x+y=10 dan x+2y=11. Darab persamaan kedua dengan 2, kemudian tolak persamaan pertama: 3y=12, maka y=4. Ganti semula: x=3.", "diagram": ""}, {"chapter": 3, "question": "Premium asas polisi insurans ialah RM400. Jika diskaun tanpa tuntutan (NCD) ialah 10%, cari premium selepas diskaun.", "options": ["RM440", "RM400", "RM360", "RM380"], "correct": 2, "explanation": "Diskaun = 10% × RM400 = RM40. Premium = RM400 − RM40 = RM360.", "diagram": ""}, {"chapter": 3, "question": "Kadar premium ialah RM3 bagi setiap RM1,000 jumlah diinsuranskan. Cari premium bagi jumlah diinsuranskan RM30,000.", "options": ["RM180", "RM93", "RM90", "RM87"], "correct": 2, "explanation": "Bilangan unit RM1,000 = 30000/1,000 = 30. Premium = 30 × RM3 = RM90.", "diagram": ""}, {"chapter": 3, "question": "Satu tuntutan kerosakan dilindungi sepenuhnya tetapi mempunyai deduktibel RM400. Jika kerugian RM2500, berapakah bayaran syarikat insurans?", "options": ["RM2900", "RM2100", "RM400", "RM2500"], "correct": 1, "explanation": "Bayaran insurans = kerugian − deduktibel = RM2500 − RM400 = RM2100.", "diagram": ""}, {"chapter": 3, "question": "Sebuah rumah diinsuranskan sebanyak RM40,000 dan nilai boleh insuransnya RM50,000. Berapakah peratus perlindungan?", "options": ["80%", "90%", "70%", "20%"], "correct": 0, "explanation": "Peratus perlindungan = (40000/50000) × 100% = 80%.", "diagram": ""}, {"chapter": 3, "question": "Premium insurans tahunan ialah RM1320. Berapakah bayaran purata sebulan jika dibahagi sama rata kepada 12 bulan?", "options": ["RM132", "RM110", "RM120", "RM100"], "correct": 1, "explanation": "Bayaran sebulan = RM1320 ÷ 12 = RM110.", "diagram": ""}, {"chapter": 4, "question": "Bagi suatu latihan, kadar cukai pendapatan ialah 5% secara rata atas pendapatan bercukai RM11,000. Berapakah cukai?", "options": ["RM450", "RM550", "RM650", "RM5500"], "correct": 1, "explanation": "Cukai = 5% × RM11000 = RM550. Ini kadar rekaan dalam soalan, bukan jadual cukai sebenar.", "diagram": ""}, {"chapter": 4, "question": "Pendapatan tahunan ialah RM51,000 dan jumlah pelepasan cukai RM10,000. Cari pendapatan bercukai (andaikan tiada potongan lain).", "options": ["RM41000", "RM61000", "RM42000", "RM51000"], "correct": 0, "explanation": "Pendapatan bercukai = pendapatan tahunan − pelepasan = RM51000 − RM10000 = RM41000.", "diagram": ""}, {"chapter": 4, "question": "Sebuah barang berharga RM220 dikenakan cukai jualan 10%. Berapakah harga termasuk cukai?", "options": ["RM242", "RM220", "RM198", "RM252"], "correct": 0, "explanation": "Cukai = 10% × RM220 = RM22. Harga akhir = RM220 + RM22 = RM242.", "diagram": ""}, {"chapter": 4, "question": "Cukai pendapatan yang dikira ialah RM350. Jika rebat cukai yang layak ialah RM100, cari cukai kena dibayar.", "options": ["RM250", "RM450", "RM350", "RM100"], "correct": 0, "explanation": "Cukai kena dibayar = cukai dikira − rebat = RM350 − RM100 = RM250.", "diagram": ""}, {"chapter": 4, "question": "Jumlah cukai taksiran tahunan ialah RM720. Jika dibayar dalam dua ansuran sama banyak, berapakah setiap ansuran?", "options": ["RM420", "RM720", "RM180", "RM360"], "correct": 3, "explanation": "Ansuran = RM720 ÷ 2 = RM360.", "diagram": ""}, {"chapter": 5, "question": "Suatu segi tiga dibesarkan dengan faktor skala 2. Jika panjang sisi asal 3 cm, berapakah panjang sisi imej?", "options": ["12 cm", "6 cm", "5 cm", "3 cm"], "correct": 1, "explanation": "Panjang imej = faktor skala × panjang asal = 2 × 3 = 6 cm.", "diagram": ""}, {"chapter": 5, "question": "Luas suatu bentuk ialah 12 cm². Bentuk itu dibesarkan dengan faktor skala 3. Cari luas imej.", "options": ["117 cm²", "21 cm²", "108 cm²", "36 cm²"], "correct": 2, "explanation": "Luas imej = luas asal × (faktor skala)² = 12 × 3² = 108 cm².", "diagram": ""}, {"chapter": 5, "question": "Titik P(3, 4) ditranslasikan oleh vektor (2, −1). Apakah koordinat imej P′?", "options": ["(3, 4)", "(1, 3)", "(5, 3)", "(5, 5)"], "correct": 2, "explanation": "P′ = (3+2, 4−1) = (5, 3).", "diagram": ""}, {"chapter": 5, "question": "Titik Q(3, 4) dipantulkan pada paksi-y. Apakah imej Q′?", "options": ["(4, 3)", "(-3, 4)", "(-3, -4)", "(3, -4)"], "correct": 1, "explanation": "Pantulan pada paksi-y menukar tanda koordinat x sahaja. Maka Q′ = (-3, 4).", "diagram": ""}, {"chapter": 5, "question": "Titik R(3, 4) diputar 90° lawan arah jam tentang asalan. Cari imej R′.", "options": ["(3, -4)", "(4, -3)", "(-4, 3)", "(-3, -4)"], "correct": 2, "explanation": "Putaran 90° lawan jam: (x,y) → (−y,x). Maka R′ = (-4,3).", "diagram": ""}, {"chapter": 6, "question": "Cari nilai tepat sin 30° bagi latihan Set A.", "options": ["1/2", "0", "1", "√3/2"], "correct": 0, "explanation": "Berdasarkan sudut khas, sin 30° = 1/2.", "diagram": ""}, {"chapter": 6, "question": "Cari nilai tepat kos 60° bagi latihan Set A.", "options": ["0", "√3/2", "1", "1/2"], "correct": 3, "explanation": "Berdasarkan sudut khas, kos 60° = 1/2.", "diagram": ""}, {"chapter": 6, "question": "Berapakah amplitud bagi graf y = 3 sin x?", "options": ["6", "4", "2", "3"], "correct": 3, "explanation": "Amplitud bagi y = a sin x ialah |a|. Jadi amplitud = 3.", "diagram": ""}, {"chapter": 6, "question": "Apakah tempoh bagi graf y = sin(2x) dalam darjah?", "options": ["270°", "240°", "180°", "210°"], "correct": 2, "explanation": "Tempoh = 360° ÷ 2 = 180°.", "diagram": ""}, {"chapter": 6, "question": "Graf y = 2 sin x mempunyai nilai maksimum berapa?", "options": ["3", "-2", "2", "1"], "correct": 2, "explanation": "Nilai maksimum sin x ialah 1. Maka nilai maksimum y = 2 × 1 = 2.", "diagram": ""}, {"chapter": 7, "question": "Jadual kekerapan mempunyai kekerapan 2, 3, 4 dan 6. Berapakah jumlah bilangan data?", "options": ["17", "15", "14", "16"], "correct": 1, "explanation": "Jumlah kekerapan = 2 + 3 + 4 + 6 = 15.", "diagram": ""}, {"chapter": 7, "question": "Bagi selang kelas 12–22, cari titik tengah kelas.", "options": ["22", "17", "18", "12"], "correct": 1, "explanation": "Titik tengah = (12+22)/2 = 17.", "diagram": ""}, {"chapter": 7, "question": "Bagi kelas 15–24 (data integer), apakah sempadan bawah kelas?", "options": ["15", "14", "14.5", "15.5"], "correct": 2, "explanation": "Sempadan bawah = had bawah − 0.5 = 15 − 0.5 = 14.5.", "diagram": ""}, {"chapter": 7, "question": "Bagi satu kelas, kekerapan ialah 4 dan titik tengah ialah 20. Cari hasil darab fx.", "options": ["80", "24", "84", "100"], "correct": 0, "explanation": "fx = f × x = 4 × 20 = 80.", "diagram": ""}, {"chapter": 7, "question": "Empat titik tengah kelas ialah 11, 13, 15, 17 dengan kekerapan sama. Cari min anggaran.", "options": ["16", "13", "15", "14"], "correct": 3, "explanation": "Min anggaran = jumlah fx / jumlah f = (11 + 13 + 15 + 17)/4 = 14.", "diagram": ""}, {"chapter": 8, "question": "Suatu model linear ialah y = 3x + 2. Ramalkan y apabila x = 3.", "options": ["14", "11", "9", "13"], "correct": 1, "explanation": "Gantikan x=3: y = 3(3)+2 = 11.", "diagram": ""}, {"chapter": 8, "question": "Model kos C = 100 + 20n (RM) digunakan bagi n unit. Cari C apabila n = 5.", "options": ["RM100", "RM200", "RM180", "RM220"], "correct": 1, "explanation": "C = 100 + 20(5) = RM200.", "diagram": ""}, {"chapter": 8, "question": "Model y = 2x² digunakan untuk menganggar suatu kuantiti. Cari y apabila x = 3.", "options": ["6", "20", "18", "9"], "correct": 2, "explanation": "y = 2(3)² = 2 × 9 = 18.", "diagram": ""}, {"chapter": 8, "question": "Suatu populasi bermula dengan 110 dan meningkat 10% dalam satu tempoh. Anggarkan populasi selepas satu tempoh.", "options": ["99", "121", "132", "110"], "correct": 1, "explanation": "Model pertumbuhan satu tempoh: P = 110(1+0.10) = 121.", "diagram": ""}, {"chapter": 8, "question": "Jarak d (km) dimodelkan oleh d = 5t + 10. Jika t = 3 jam, cari d.", "options": ["20 km", "25 km", "15 km", "30 km"], "correct": 1, "explanation": "d = 5(3)+10 = 25 km.", "diagram": ""}];let questions=[],index=0,answers=[];const abc='ABCD';function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}function start(){questions=shuffle(bank.map(q=>{const correctText=q.options[q.correct];const opts=shuffle(q.options);return {...q,options:opts,correct:opts.indexOf(correctText)};}));index=0;answers=[];render();}function render(){const el=document.getElementById('quiz');if(index>=questions.length){const score=questions.reduce((n,q,i)=>n+(answers[i]===q.correct?1:0),0);const review=(onlyWrong)=>questions.map((q,i)=>({q,i})).filter(o=>!onlyWrong||answers[o.i]!==o.q.correct).map(({q,i})=>`<article class="${answers[i]===q.correct?'right':'wrong'}"><b>Soalan ${i+1} — Bab ${q.chapter}: ${escapeHTML(["Ubahan", "Matriks", "Matematik Pengguna: Insurans", "Matematik Pengguna: Percukaian", "Kekongruenan, Pembesaran dan Gabungan Transformasi", "Nisbah dan Graf Fungsi Trigonometri", "Sukatan Serakan Data Terkumpul", "Pemodelan Matematik"][q.chapter-1])}</b><p>${escapeHTML(q.question)}</p><p>Jawapan anda: ${abc[answers[i]]}. ${escapeHTML(q.options[answers[i]])}</p><p><b>Jawapan betul: ${abc[q.correct]}. ${escapeHTML(q.options[q.correct])}</b></p><div class="explain"><b>Jalan pengiraan / penerangan:</b>
${escapeHTML(q.explanation)}</div></article>`).join('')||'<p>Tahniah, semua jawapan betul!</p>';el.innerHTML=`<h2>Keputusan: ${score}/40 (${(score/40*100).toFixed(1)}%)</h2><p>Semakan jawapan tersedia selepas cubaan pertama.</p><button onclick="document.getElementById('reviews').innerHTML=window.reviewWrong()">Lihat jawapan salah</button><button onclick="document.getElementById('reviews').innerHTML=window.reviewAll()">Semak semua jawapan</button><button onclick="start()">Cuba lagi</button><div id="reviews"></div>`;window.reviewWrong=()=>review(true);window.reviewAll=()=>review(false);document.getElementById('reviews').innerHTML=review(true);return;}const q=questions[index];el.innerHTML=`<p class="progress">Soalan ${index+1} / 40 • Bab ${q.chapter}: ${escapeHTML(["Ubahan", "Matriks", "Matematik Pengguna: Insurans", "Matematik Pengguna: Percukaian", "Kekongruenan, Pembesaran dan Gabungan Transformasi", "Nisbah dan Graf Fungsi Trigonometri", "Sukatan Serakan Data Terkumpul", "Pemodelan Matematik"][q.chapter-1])}</p><h3>${escapeHTML(q.question)}</h3><div id="choices">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="ans" value="${i}"> ${abc[i]}. ${escapeHTML(o)}</label>`).join('')}</div><button id="next" disabled>${index===39?'Lihat keputusan':'Soalan seterusnya'}</button>`;document.querySelectorAll('input[name=ans]').forEach(e=>e.onchange=()=>document.getElementById('next').disabled=false);document.getElementById('next').onclick=()=>{answers.push(Number(document.querySelector('input[name=ans]:checked').value));index++;render();window.scrollTo(0,0);};}start();</script></body></html>
