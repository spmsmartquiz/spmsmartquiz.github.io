<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matematik Tingkatan 5 — Kertas 1 Set D | SPM Smart Quiz</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#eef4ff;color:#203047;margin:0}header{background:#294e97;color:white;padding:20px;text-align:center}main{max-width:740px;margin:20px auto;padding:0 12px}.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #dce4f0}.option{display:block;border:1px solid #cbd8ec;border-radius:10px;padding:13px;margin:9px 0;cursor:pointer}.option:has(input:checked){background:#e8f0ff;border-color:#294e97}button{background:#294e97;color:white;border:0;border-radius:10px;padding:13px 16px;font-weight:bold;cursor:pointer;margin:7px 5px 7px 0}button:disabled{opacity:.5}.wrong{border-left:4px solid #c64242;background:#fff2f0;padding:13px;margin:12px 0}.right{border-left:4px solid #27936b;background:#edfaf5;padding:13px;margin:12px 0}.muted{color:#667085}.explain{white-space:pre-wrap;line-height:1.6;background:#f3f6fb;padding:12px;border-radius:8px}a{color:#294e97}.progress{font-weight:bold}</style></head><body><header><h2>SPM Smart Quiz</h2><p>Matematik Tingkatan 5 • Kertas 1 • Set D</p></header><main><section class="card"><p>40 soalan objektif • 40 markah • 8 bab • Tiada had masa</p><p class="muted">Soalan latihan asli berasaskan KSSM Tingkatan 5, bukan soalan rasmi SPM. Jawapan dan jalan pengiraan dipaparkan selepas selesai.</p><a href="index.html#matematik5">← Kembali ke menu Matematik Tingkatan 5</a></section><section class="card" id="quiz"></section></main><script>const bank=[{"chapter": 1, "question": "y berubah secara langsung dengan x. Jika y = 36 apabila x = 6, cari y apabila x = 7.", "options": ["48", "36", "54", "42"], "correct": 3, "explanation": "y = kx. Pemalar k = 36/6 = 6. Maka y = 6 × 7 = 42.", "diagram": ""}, {"chapter": 1, "question": "y berubah secara langsung dengan kuasa dua x. Jika y = 216 apabila x = 6, cari y apabila x = 8.", "options": ["48", "384", "378", "390"], "correct": 1, "explanation": "y = kx²; k = 216/36 = 6. Apabila x = 8, y = 6 × 8² = 384.", "diagram": ""}, {"chapter": 1, "question": "y berubah secara songsang dengan x. Jika y = 20 apabila x = 3, cari y apabila x = 6.", "options": ["14", "16", "10", "12"], "correct": 2, "explanation": "y = k/x; k = xy = 3 × 20 = 60. Maka y = 60/6 = 10.", "diagram": ""}, {"chapter": 1, "question": "z berubah secara tercantum dengan x dan y. Jika z = 252 apabila x = 6 dan y = 7, cari z apabila x = 7 dan y = 8.", "options": ["294", "342", "336", "288"], "correct": 2, "explanation": "z = kxy; k = 252/(6 × 7) = 6. Jadi z = 6 × 7 × 8 = 336.", "diagram": ""}, {"chapter": 1, "question": "Diberi y ∝ x dan y = 24 apabila x = 4. Berapakah nilai x apabila y = 42?", "options": ["9", "7", "6", "8"], "correct": 1, "explanation": "k = 24/4 = 6. Daripada 42 = 6x, x = 7.", "diagram": ""}, {"chapter": 2, "question": "Diberi matriks A = [[5, 6], [7, 8]]. Cari jumlah semua unsur pada pepenjuru utama A.", "options": ["14", "15", "12", "13"], "correct": 3, "explanation": "Pepenjuru utama terdiri daripada 5 dan 8. Jumlah = 5+8 = 13.", "diagram": ""}, {"chapter": 2, "question": "Diberi A = [[5, 6], [7, 8]] dan B = [[1, 2], [3, 4]]. Cari unsur baris pertama lajur kedua bagi A + B.", "options": ["9", "8", "10", "7"], "correct": 1, "explanation": "Tambah unsur sepadan: 6 + 2 = 8.", "diagram": ""}, {"chapter": 2, "question": "Jika A = [[5, 6], [7, 8]], cari unsur baris kedua lajur pertama bagi 3A.", "options": ["21", "20", "24", "22"], "correct": 0, "explanation": "Darab setiap unsur A dengan 3. Unsur tersebut = 3 × 7 = 21.", "diagram": ""}, {"chapter": 2, "question": "Cari penentu bagi matriks [[6, 5], [1, 7]].", "options": ["35", "39", "47", "37"], "correct": 3, "explanation": "Penentu = ad − bc = (6 × 7) − (5 × 1) = 37.", "diagram": ""}, {"chapter": 2, "question": "Penyelesaian persamaan matriks [[2, 1], [1, 2]] [[x], [y]] = [[19], [20]] ialah", "options": ["x = 7, y = 6", "x = 6, y = 7", "x = 7, y = 7", "x = 6, y = 8"], "correct": 1, "explanation": "Persamaan: 2x+y=19 dan x+2y=20. Darab persamaan kedua dengan 2, kemudian tolak persamaan pertama: 3y=21, maka y=7. Ganti semula: x=6.", "diagram": ""}, {"chapter": 3, "question": "Premium asas polisi insurans ialah RM700. Jika diskaun tanpa tuntutan (NCD) ialah 40%, cari premium selepas diskaun.", "options": ["RM420", "RM700", "RM440", "RM980"], "correct": 0, "explanation": "Diskaun = 40% × RM700 = RM280. Premium = RM700 − RM280 = RM420.", "diagram": ""}, {"chapter": 3, "question": "Kadar premium ialah RM6 bagi setiap RM1,000 jumlah diinsuranskan. Cari premium bagi jumlah diinsuranskan RM60,000.", "options": ["RM360", "RM366", "RM720", "RM354"], "correct": 0, "explanation": "Bilangan unit RM1,000 = 60000/1,000 = 60. Premium = 60 × RM6 = RM360.", "diagram": ""}, {"chapter": 3, "question": "Satu tuntutan kerosakan dilindungi sepenuhnya tetapi mempunyai deduktibel RM700. Jika kerugian RM4000, berapakah bayaran syarikat insurans?", "options": ["RM4000", "RM3300", "RM700", "RM4700"], "correct": 1, "explanation": "Bayaran insurans = kerugian − deduktibel = RM4000 − RM700 = RM3300.", "diagram": ""}, {"chapter": 3, "question": "Sebuah rumah diinsuranskan sebanyak RM64,000 dan nilai boleh insuransnya RM80,000. Berapakah peratus perlindungan?", "options": ["80%", "70%", "20%", "90%"], "correct": 0, "explanation": "Peratus perlindungan = (64000/80000) × 100% = 80%.", "diagram": ""}, {"chapter": 3, "question": "Premium insurans tahunan ialah RM1680. Berapakah bayaran purata sebulan jika dibahagi sama rata kepada 12 bulan?", "options": ["RM140", "RM130", "RM150", "RM168"], "correct": 0, "explanation": "Bayaran sebulan = RM1680 ÷ 12 = RM140.", "diagram": ""}, {"chapter": 4, "question": "Bagi suatu latihan, kadar cukai pendapatan ialah 5% secara rata atas pendapatan bercukai RM14,000. Berapakah cukai?", "options": ["RM800", "RM7000", "RM600", "RM700"], "correct": 3, "explanation": "Cukai = 5% × RM14000 = RM700. Ini kadar rekaan dalam soalan, bukan jadual cukai sebenar.", "diagram": ""}, {"chapter": 4, "question": "Pendapatan tahunan ialah RM54,000 dan jumlah pelepasan cukai RM13,000. Cari pendapatan bercukai (andaikan tiada potongan lain).", "options": ["RM54000", "RM67000", "RM42000", "RM41000"], "correct": 3, "explanation": "Pendapatan bercukai = pendapatan tahunan − pelepasan = RM54000 − RM13000 = RM41000.", "diagram": ""}, {"chapter": 4, "question": "Sebuah barang berharga RM280 dikenakan cukai jualan 10%. Berapakah harga termasuk cukai?", "options": ["RM252", "RM280", "RM308", "RM318"], "correct": 2, "explanation": "Cukai = 10% × RM280 = RM28. Harga akhir = RM280 + RM28 = RM308.", "diagram": ""}, {"chapter": 4, "question": "Cukai pendapatan yang dikira ialah RM500. Jika rebat cukai yang layak ialah RM100, cari cukai kena dibayar.", "options": ["RM100", "RM500", "RM400", "RM600"], "correct": 2, "explanation": "Cukai kena dibayar = cukai dikira − rebat = RM500 − RM100 = RM400.", "diagram": ""}, {"chapter": 4, "question": "Jumlah cukai taksiran tahunan ialah RM1080. Jika dibayar dalam dua ansuran sama banyak, berapakah setiap ansuran?", "options": ["RM540", "RM600", "RM1080", "RM270"], "correct": 0, "explanation": "Ansuran = RM1080 ÷ 2 = RM540.", "diagram": ""}, {"chapter": 5, "question": "Suatu segi tiga dibesarkan dengan faktor skala 2. Jika panjang sisi asal 6 cm, berapakah panjang sisi imej?", "options": ["24 cm", "6 cm", "8 cm", "12 cm"], "correct": 3, "explanation": "Panjang imej = faktor skala × panjang asal = 2 × 6 = 12 cm.", "diagram": ""}, {"chapter": 5, "question": "Luas suatu bentuk ialah 24 cm². Bentuk itu dibesarkan dengan faktor skala 3. Cari luas imej.", "options": ["33 cm²", "72 cm²", "225 cm²", "216 cm²"], "correct": 3, "explanation": "Luas imej = luas asal × (faktor skala)² = 24 × 3² = 216 cm².", "diagram": ""}, {"chapter": 5, "question": "Titik P(6, 7) ditranslasikan oleh vektor (2, −1). Apakah koordinat imej P′?", "options": ["(8, 6)", "(6, 7)", "(4, 6)", "(8, 8)"], "correct": 0, "explanation": "P′ = (6+2, 7−1) = (8, 6).", "diagram": ""}, {"chapter": 5, "question": "Titik Q(6, 7) dipantulkan pada paksi-y. Apakah imej Q′?", "options": ["(7, 6)", "(-6, -7)", "(6, -7)", "(-6, 7)"], "correct": 3, "explanation": "Pantulan pada paksi-y menukar tanda koordinat x sahaja. Maka Q′ = (-6, 7).", "diagram": ""}, {"chapter": 5, "question": "Titik R(6, 7) diputar 90° lawan arah jam tentang asalan. Cari imej R′.", "options": ["(6, -7)", "(-6, -7)", "(7, -6)", "(-7, 6)"], "correct": 3, "explanation": "Putaran 90° lawan jam: (x,y) → (−y,x). Maka R′ = (-7,6).", "diagram": ""}, {"chapter": 6, "question": "Cari nilai tepat sin 30° bagi latihan Set D.", "options": ["0", "√3/2", "1", "1/2"], "correct": 3, "explanation": "Berdasarkan sudut khas, sin 30° = 1/2.", "diagram": ""}, {"chapter": 6, "question": "Cari nilai tepat kos 60° bagi latihan Set D.", "options": ["1", "1/2", "0", "√3/2"], "correct": 1, "explanation": "Berdasarkan sudut khas, kos 60° = 1/2.", "diagram": ""}, {"chapter": 6, "question": "Berapakah amplitud bagi graf y = 6 sin x?", "options": ["12", "6", "5", "7"], "correct": 1, "explanation": "Amplitud bagi y = a sin x ialah |a|. Jadi amplitud = 6.", "diagram": ""}, {"chapter": 6, "question": "Apakah tempoh bagi graf y = sin(5x) dalam darjah?", "options": ["72°", "162°", "102°", "132°"], "correct": 0, "explanation": "Tempoh = 360° ÷ 5 = 72°.", "diagram": ""}, {"chapter": 6, "question": "Graf y = 5 sin x mempunyai nilai maksimum berapa?", "options": ["6", "5", "4", "-5"], "correct": 1, "explanation": "Nilai maksimum sin x ialah 1. Maka nilai maksimum y = 5 × 1 = 5.", "diagram": ""}, {"chapter": 7, "question": "Jadual kekerapan mempunyai kekerapan 2, 3, 4 dan 9. Berapakah jumlah bilangan data?", "options": ["17", "20", "19", "18"], "correct": 3, "explanation": "Jumlah kekerapan = 2 + 3 + 4 + 9 = 18.", "diagram": ""}, {"chapter": 7, "question": "Bagi selang kelas 18–28, cari titik tengah kelas.", "options": ["28", "18", "24", "23"], "correct": 3, "explanation": "Titik tengah = (18+28)/2 = 23.", "diagram": ""}, {"chapter": 7, "question": "Bagi kelas 30–39 (data integer), apakah sempadan bawah kelas?", "options": ["29.5", "29", "30.5", "30"], "correct": 0, "explanation": "Sempadan bawah = had bawah − 0.5 = 30 − 0.5 = 29.5.", "diagram": ""}, {"chapter": 7, "question": "Bagi satu kelas, kekerapan ialah 7 dan titik tengah ialah 35. Cari hasil darab fx.", "options": ["280", "245", "252", "42"], "correct": 1, "explanation": "fx = f × x = 7 × 35 = 245.", "diagram": ""}, {"chapter": 7, "question": "Empat titik tengah kelas ialah 14, 16, 18, 20 dengan kekerapan sama. Cari min anggaran.", "options": ["17", "19", "16", "18"], "correct": 0, "explanation": "Min anggaran = jumlah fx / jumlah f = (14 + 16 + 18 + 20)/4 = 17.", "diagram": ""}, {"chapter": 8, "question": "Suatu model linear ialah y = 3x + 2. Ramalkan y apabila x = 6.", "options": ["23", "18", "20", "22"], "correct": 2, "explanation": "Gantikan x=6: y = 3(6)+2 = 20.", "diagram": ""}, {"chapter": 8, "question": "Model kos C = 100 + 20n (RM) digunakan bagi n unit. Cari C apabila n = 8.", "options": ["RM160", "RM260", "RM240", "RM280"], "correct": 1, "explanation": "C = 100 + 20(8) = RM260.", "diagram": ""}, {"chapter": 8, "question": "Model y = 2x² digunakan untuk menganggar suatu kuantiti. Cari y apabila x = 6.", "options": ["74", "72", "36", "12"], "correct": 1, "explanation": "y = 2(6)² = 2 × 36 = 72.", "diagram": ""}, {"chapter": 8, "question": "Suatu populasi bermula dengan 140 dan meningkat 10% dalam satu tempoh. Anggarkan populasi selepas satu tempoh.", "options": ["154", "168", "126", "140"], "correct": 0, "explanation": "Model pertumbuhan satu tempoh: P = 140(1+0.10) = 154.", "diagram": ""}, {"chapter": 8, "question": "Jarak d (km) dimodelkan oleh d = 5t + 10. Jika t = 6 jam, cari d.", "options": ["30 km", "45 km", "35 km", "40 km"], "correct": 3, "explanation": "d = 5(6)+10 = 40 km.", "diagram": ""}];let questions=[],index=0,answers=[];const abc='ABCD';function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}function start(){questions=shuffle(bank.map(q=>{const correctText=q.options[q.correct];const opts=shuffle(q.options);return {...q,options:opts,correct:opts.indexOf(correctText)};}));index=0;answers=[];render();}function render(){const el=document.getElementById('quiz');if(index>=questions.length){const score=questions.reduce((n,q,i)=>n+(answers[i]===q.correct?1:0),0);const review=(onlyWrong)=>questions.map((q,i)=>({q,i})).filter(o=>!onlyWrong||answers[o.i]!==o.q.correct).map(({q,i})=>`<article class="${answers[i]===q.correct?'right':'wrong'}"><b>Soalan ${i+1} — Bab ${q.chapter}: ${escapeHTML(["Ubahan", "Matriks", "Matematik Pengguna: Insurans", "Matematik Pengguna: Percukaian", "Kekongruenan, Pembesaran dan Gabungan Transformasi", "Nisbah dan Graf Fungsi Trigonometri", "Sukatan Serakan Data Terkumpul", "Pemodelan Matematik"][q.chapter-1])}</b><p>${escapeHTML(q.question)}</p><p>Jawapan anda: ${abc[answers[i]]}. ${escapeHTML(q.options[answers[i]])}</p><p><b>Jawapan betul: ${abc[q.correct]}. ${escapeHTML(q.options[q.correct])}</b></p><div class="explain"><b>Jalan pengiraan / penerangan:</b>
${escapeHTML(q.explanation)}</div></article>`).join('')||'<p>Tahniah, semua jawapan betul!</p>';el.innerHTML=`<h2>Keputusan: ${score}/40 (${(score/40*100).toFixed(1)}%)</h2><p>Semakan jawapan tersedia selepas cubaan pertama.</p><button onclick="document.getElementById('reviews').innerHTML=window.reviewWrong()">Lihat jawapan salah</button><button onclick="document.getElementById('reviews').innerHTML=window.reviewAll()">Semak semua jawapan</button><button onclick="start()">Cuba lagi</button><div id="reviews"></div>`;window.reviewWrong=()=>review(true);window.reviewAll=()=>review(false);document.getElementById('reviews').innerHTML=review(true);return;}const q=questions[index];el.innerHTML=`<p class="progress">Soalan ${index+1} / 40 • Bab ${q.chapter}: ${escapeHTML(["Ubahan", "Matriks", "Matematik Pengguna: Insurans", "Matematik Pengguna: Percukaian", "Kekongruenan, Pembesaran dan Gabungan Transformasi", "Nisbah dan Graf Fungsi Trigonometri", "Sukatan Serakan Data Terkumpul", "Pemodelan Matematik"][q.chapter-1])}</p><h3>${escapeHTML(q.question)}</h3><div id="choices">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="ans" value="${i}"> ${abc[i]}. ${escapeHTML(o)}</label>`).join('')}</div><button id="next" disabled>${index===39?'Lihat keputusan':'Soalan seterusnya'}</button>`;document.querySelectorAll('input[name=ans]').forEach(e=>e.onchange=()=>document.getElementById('next').disabled=false);document.getElementById('next').onclick=()=>{answers.push(Number(document.querySelector('input[name=ans]:checked').value));index++;render();window.scrollTo(0,0);};}start();</script></body></html>
