<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matematik Tingkatan 5 — Kertas 1 Set C | SPM Smart Quiz</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#eef4ff;color:#203047;margin:0}header{background:#294e97;color:white;padding:20px;text-align:center}main{max-width:740px;margin:20px auto;padding:0 12px}.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #dce4f0}.option{display:block;border:1px solid #cbd8ec;border-radius:10px;padding:13px;margin:9px 0;cursor:pointer}.option:has(input:checked){background:#e8f0ff;border-color:#294e97}button{background:#294e97;color:white;border:0;border-radius:10px;padding:13px 16px;font-weight:bold;cursor:pointer;margin:7px 5px 7px 0}button:disabled{opacity:.5}.wrong{border-left:4px solid #c64242;background:#fff2f0;padding:13px;margin:12px 0}.right{border-left:4px solid #27936b;background:#edfaf5;padding:13px;margin:12px 0}.muted{color:#667085}.explain{white-space:pre-wrap;line-height:1.6;background:#f3f6fb;padding:12px;border-radius:8px}a{color:#294e97}.progress{font-weight:bold}</style></head><body><header><h2>SPM Smart Quiz</h2><p>Matematik Tingkatan 5 • Kertas 1 • Set C</p></header><main><section class="card"><p>40 soalan objektif • 40 markah • 8 bab • Tiada had masa</p><p class="muted">Soalan latihan asli berasaskan KSSM Tingkatan 5, bukan soalan rasmi SPM. Jawapan dan jalan pengiraan dipaparkan selepas selesai.</p><a href="index.html#matematik5">← Kembali ke menu Matematik Tingkatan 5</a></section><section class="card" id="quiz"></section></main><script>const bank=[{"chapter": 1, "question": "y berubah secara langsung dengan x. Jika y = 25 apabila x = 5, cari y apabila x = 6.", "options": ["35", "25", "30", "40"], "correct": 2, "explanation": "y = kx. Pemalar k = 25/5 = 5. Maka y = 5 × 6 = 30.", "diagram": ""}, {"chapter": 1, "question": "y berubah secara langsung dengan kuasa dua x. Jika y = 125 apabila x = 5, cari y apabila x = 7.", "options": ["245", "240", "35", "250"], "correct": 0, "explanation": "y = kx²; k = 125/25 = 5. Apabila x = 7, y = 5 × 7² = 245.", "diagram": ""}, {"chapter": 1, "question": "y berubah secara songsang dengan x. Jika y = 16 apabila x = 3, cari y apabila x = 6.", "options": ["14", "12", "8", "10"], "correct": 2, "explanation": "y = k/x; k = xy = 3 × 16 = 48. Maka y = 48/6 = 8.", "diagram": ""}, {"chapter": 1, "question": "z berubah secara tercantum dengan x dan y. Jika z = 150 apabila x = 5 dan y = 6, cari z apabila x = 6 dan y = 7.", "options": ["180", "210", "215", "175"], "correct": 1, "explanation": "z = kxy; k = 150/(5 × 6) = 5. Jadi z = 5 × 6 × 7 = 210.", "diagram": ""}, {"chapter": 1, "question": "Diberi y ∝ x dan y = 20 apabila x = 4. Berapakah nilai x apabila y = 35?", "options": ["6", "7", "8", "9"], "correct": 1, "explanation": "k = 20/4 = 5. Daripada 35 = 5x, x = 7.", "diagram": ""}, {"chapter": 2, "question": "Diberi matriks A = [[4, 5], [6, 7]]. Cari jumlah semua unsur pada pepenjuru utama A.", "options": ["12", "11", "13", "10"], "correct": 1, "explanation": "Pepenjuru utama terdiri daripada 4 dan 7. Jumlah = 4+7 = 11.", "diagram": ""}, {"chapter": 2, "question": "Diberi A = [[4, 5], [6, 7]] dan B = [[1, 2], [3, 4]]. Cari unsur baris pertama lajur kedua bagi A + B.", "options": ["9", "6", "8", "7"], "correct": 3, "explanation": "Tambah unsur sepadan: 5 + 2 = 7.", "diagram": ""}, {"chapter": 2, "question": "Jika A = [[4, 5], [6, 7]], cari unsur baris kedua lajur pertama bagi 3A.", "options": ["18", "17", "19", "21"], "correct": 0, "explanation": "Darab setiap unsur A dengan 3. Unsur tersebut = 3 × 6 = 18.", "diagram": ""}, {"chapter": 2, "question": "Cari penentu bagi matriks [[5, 4], [1, 6]].", "options": ["28", "26", "24", "34"], "correct": 1, "explanation": "Penentu = ad − bc = (5 × 6) − (4 × 1) = 26.", "diagram": ""}, {"chapter": 2, "question": "Penyelesaian persamaan matriks [[2, 1], [1, 2]] [[x], [y]] = [[16], [17]] ialah", "options": ["x = 5, y = 7", "x = 6, y = 5", "x = 6, y = 6", "x = 5, y = 6"], "correct": 3, "explanation": "Persamaan: 2x+y=16 dan x+2y=17. Darab persamaan kedua dengan 2, kemudian tolak persamaan pertama: 3y=18, maka y=6. Ganti semula: x=5.", "diagram": ""}, {"chapter": 3, "question": "Premium asas polisi insurans ialah RM600. Jika diskaun tanpa tuntutan (NCD) ialah 30%, cari premium selepas diskaun.", "options": ["RM780", "RM440", "RM600", "RM420"], "correct": 3, "explanation": "Diskaun = 30% × RM600 = RM180. Premium = RM600 − RM180 = RM420.", "diagram": ""}, {"chapter": 3, "question": "Kadar premium ialah RM5 bagi setiap RM1,000 jumlah diinsuranskan. Cari premium bagi jumlah diinsuranskan RM50,000.", "options": ["RM245", "RM250", "RM500", "RM255"], "correct": 1, "explanation": "Bilangan unit RM1,000 = 50000/1,000 = 50. Premium = 50 × RM5 = RM250.", "diagram": ""}, {"chapter": 3, "question": "Satu tuntutan kerosakan dilindungi sepenuhnya tetapi mempunyai deduktibel RM600. Jika kerugian RM3500, berapakah bayaran syarikat insurans?", "options": ["RM3500", "RM2900", "RM4100", "RM600"], "correct": 1, "explanation": "Bayaran insurans = kerugian − deduktibel = RM3500 − RM600 = RM2900.", "diagram": ""}, {"chapter": 3, "question": "Sebuah rumah diinsuranskan sebanyak RM56,000 dan nilai boleh insuransnya RM70,000. Berapakah peratus perlindungan?", "options": ["20%", "90%", "80%", "70%"], "correct": 2, "explanation": "Peratus perlindungan = (56000/70000) × 100% = 80%.", "diagram": ""}, {"chapter": 3, "question": "Premium insurans tahunan ialah RM1560. Berapakah bayaran purata sebulan jika dibahagi sama rata kepada 12 bulan?", "options": ["RM130", "RM120", "RM140", "RM156"], "correct": 0, "explanation": "Bayaran sebulan = RM1560 ÷ 12 = RM130.", "diagram": ""}, {"chapter": 4, "question": "Bagi suatu latihan, kadar cukai pendapatan ialah 5% secara rata atas pendapatan bercukai RM13,000. Berapakah cukai?", "options": ["RM6500", "RM650", "RM750", "RM550"], "correct": 1, "explanation": "Cukai = 5% × RM13000 = RM650. Ini kadar rekaan dalam soalan, bukan jadual cukai sebenar.", "diagram": ""}, {"chapter": 4, "question": "Pendapatan tahunan ialah RM53,000 dan jumlah pelepasan cukai RM12,000. Cari pendapatan bercukai (andaikan tiada potongan lain).", "options": ["RM42000", "RM65000", "RM53000", "RM41000"], "correct": 3, "explanation": "Pendapatan bercukai = pendapatan tahunan − pelepasan = RM53000 − RM12000 = RM41000.", "diagram": ""}, {"chapter": 4, "question": "Sebuah barang berharga RM260 dikenakan cukai jualan 10%. Berapakah harga termasuk cukai?", "options": ["RM234", "RM260", "RM296", "RM286"], "correct": 3, "explanation": "Cukai = 10% × RM260 = RM26. Harga akhir = RM260 + RM26 = RM286.", "diagram": ""}, {"chapter": 4, "question": "Cukai pendapatan yang dikira ialah RM450. Jika rebat cukai yang layak ialah RM100, cari cukai kena dibayar.", "options": ["RM100", "RM450", "RM550", "RM350"], "correct": 3, "explanation": "Cukai kena dibayar = cukai dikira − rebat = RM450 − RM100 = RM350.", "diagram": ""}, {"chapter": 4, "question": "Jumlah cukai taksiran tahunan ialah RM960. Jika dibayar dalam dua ansuran sama banyak, berapakah setiap ansuran?", "options": ["RM480", "RM240", "RM960", "RM540"], "correct": 0, "explanation": "Ansuran = RM960 ÷ 2 = RM480.", "diagram": ""}, {"chapter": 5, "question": "Suatu segi tiga dibesarkan dengan faktor skala 2. Jika panjang sisi asal 5 cm, berapakah panjang sisi imej?", "options": ["20 cm", "5 cm", "10 cm", "7 cm"], "correct": 2, "explanation": "Panjang imej = faktor skala × panjang asal = 2 × 5 = 10 cm.", "diagram": ""}, {"chapter": 5, "question": "Luas suatu bentuk ialah 20 cm². Bentuk itu dibesarkan dengan faktor skala 3. Cari luas imej.", "options": ["180 cm²", "60 cm²", "29 cm²", "189 cm²"], "correct": 0, "explanation": "Luas imej = luas asal × (faktor skala)² = 20 × 3² = 180 cm².", "diagram": ""}, {"chapter": 5, "question": "Titik P(5, 6) ditranslasikan oleh vektor (2, −1). Apakah koordinat imej P′?", "options": ["(7, 5)", "(7, 7)", "(3, 5)", "(5, 6)"], "correct": 0, "explanation": "P′ = (5+2, 6−1) = (7, 5).", "diagram": ""}, {"chapter": 5, "question": "Titik Q(5, 6) dipantulkan pada paksi-y. Apakah imej Q′?", "options": ["(5, -6)", "(-5, -6)", "(-5, 6)", "(6, 5)"], "correct": 2, "explanation": "Pantulan pada paksi-y menukar tanda koordinat x sahaja. Maka Q′ = (-5, 6).", "diagram": ""}, {"chapter": 5, "question": "Titik R(5, 6) diputar 90° lawan arah jam tentang asalan. Cari imej R′.", "options": ["(5, -6)", "(-5, -6)", "(-6, 5)", "(6, -5)"], "correct": 2, "explanation": "Putaran 90° lawan jam: (x,y) → (−y,x). Maka R′ = (-6,5).", "diagram": ""}, {"chapter": 6, "question": "Cari nilai tepat sin 60° bagi latihan Set C.", "options": ["0", "√3/2", "√2/2", "1"], "correct": 1, "explanation": "Berdasarkan sudut khas, sin 60° = √3/2.", "diagram": ""}, {"chapter": 6, "question": "Cari nilai tepat kos 45° bagi latihan Set C.", "options": ["0", "√3/2", "1", "√2/2"], "correct": 3, "explanation": "Berdasarkan sudut khas, kos 45° = √2/2.", "diagram": ""}, {"chapter": 6, "question": "Berapakah amplitud bagi graf y = 5 sin x?", "options": ["10", "6", "5", "4"], "correct": 2, "explanation": "Amplitud bagi y = a sin x ialah |a|. Jadi amplitud = 5.", "diagram": ""}, {"chapter": 6, "question": "Apakah tempoh bagi graf y = sin(4x) dalam darjah?", "options": ["120°", "180°", "90°", "150°"], "correct": 2, "explanation": "Tempoh = 360° ÷ 4 = 90°.", "diagram": ""}, {"chapter": 6, "question": "Graf y = 4 sin x mempunyai nilai maksimum berapa?", "options": ["4", "3", "5", "-4"], "correct": 0, "explanation": "Nilai maksimum sin x ialah 1. Maka nilai maksimum y = 4 × 1 = 4.", "diagram": ""}, {"chapter": 7, "question": "Jadual kekerapan mempunyai kekerapan 2, 3, 4 dan 8. Berapakah jumlah bilangan data?", "options": ["18", "16", "17", "19"], "correct": 2, "explanation": "Jumlah kekerapan = 2 + 3 + 4 + 8 = 17.", "diagram": ""}, {"chapter": 7, "question": "Bagi selang kelas 16–26, cari titik tengah kelas.", "options": ["21", "22", "26", "16"], "correct": 0, "explanation": "Titik tengah = (16+26)/2 = 21.", "diagram": ""}, {"chapter": 7, "question": "Bagi kelas 25–34 (data integer), apakah sempadan bawah kelas?", "options": ["25.5", "25", "24.5", "24"], "correct": 2, "explanation": "Sempadan bawah = had bawah − 0.5 = 25 − 0.5 = 24.5.", "diagram": ""}, {"chapter": 7, "question": "Bagi satu kelas, kekerapan ialah 6 dan titik tengah ialah 30. Cari hasil darab fx.", "options": ["36", "186", "210", "180"], "correct": 3, "explanation": "fx = f × x = 6 × 30 = 180.", "diagram": ""}, {"chapter": 7, "question": "Empat titik tengah kelas ialah 13, 15, 17, 19 dengan kekerapan sama. Cari min anggaran.", "options": ["17", "16", "15", "18"], "correct": 1, "explanation": "Min anggaran = jumlah fx / jumlah f = (13 + 15 + 17 + 19)/4 = 16.", "diagram": ""}, {"chapter": 8, "question": "Suatu model linear ialah y = 3x + 2. Ramalkan y apabila x = 5.", "options": ["15", "19", "17", "20"], "correct": 2, "explanation": "Gantikan x=5: y = 3(5)+2 = 17.", "diagram": ""}, {"chapter": 8, "question": "Model kos C = 100 + 20n (RM) digunakan bagi n unit. Cari C apabila n = 7.", "options": ["RM140", "RM260", "RM220", "RM240"], "correct": 3, "explanation": "C = 100 + 20(7) = RM240.", "diagram": ""}, {"chapter": 8, "question": "Model y = 2x² digunakan untuk menganggar suatu kuantiti. Cari y apabila x = 5.", "options": ["52", "50", "25", "10"], "correct": 1, "explanation": "y = 2(5)² = 2 × 25 = 50.", "diagram": ""}, {"chapter": 8, "question": "Suatu populasi bermula dengan 130 dan meningkat 10% dalam satu tempoh. Anggarkan populasi selepas satu tempoh.", "options": ["117", "130", "156", "143"], "correct": 3, "explanation": "Model pertumbuhan satu tempoh: P = 130(1+0.10) = 143.", "diagram": ""}, {"chapter": 8, "question": "Jarak d (km) dimodelkan oleh d = 5t + 10. Jika t = 5 jam, cari d.", "options": ["35 km", "40 km", "25 km", "30 km"], "correct": 0, "explanation": "d = 5(5)+10 = 35 km.", "diagram": ""}];let questions=[],index=0,answers=[];const abc='ABCD';function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}function start(){questions=shuffle(bank.map(q=>{const correctText=q.options[q.correct];const opts=shuffle(q.options);return {...q,options:opts,correct:opts.indexOf(correctText)};}));index=0;answers=[];render();}function render(){const el=document.getElementById('quiz');if(index>=questions.length){const score=questions.reduce((n,q,i)=>n+(answers[i]===q.correct?1:0),0);const review=(onlyWrong)=>questions.map((q,i)=>({q,i})).filter(o=>!onlyWrong||answers[o.i]!==o.q.correct).map(({q,i})=>`<article class="${answers[i]===q.correct?'right':'wrong'}"><b>Soalan ${i+1} — Bab ${q.chapter}: ${escapeHTML(["Ubahan", "Matriks", "Matematik Pengguna: Insurans", "Matematik Pengguna: Percukaian", "Kekongruenan, Pembesaran dan Gabungan Transformasi", "Nisbah dan Graf Fungsi Trigonometri", "Sukatan Serakan Data Terkumpul", "Pemodelan Matematik"][q.chapter-1])}</b><p>${escapeHTML(q.question)}</p><p>Jawapan anda: ${abc[answers[i]]}. ${escapeHTML(q.options[answers[i]])}</p><p><b>Jawapan betul: ${abc[q.correct]}. ${escapeHTML(q.options[q.correct])}</b></p><div class="explain"><b>Jalan pengiraan / penerangan:</b>
${escapeHTML(q.explanation)}</div></article>`).join('')||'<p>Tahniah, semua jawapan betul!</p>';el.innerHTML=`<h2>Keputusan: ${score}/40 (${(score/40*100).toFixed(1)}%)</h2><p>Semakan jawapan tersedia selepas cubaan pertama.</p><button onclick="document.getElementById('reviews').innerHTML=window.reviewWrong()">Lihat jawapan salah</button><button onclick="document.getElementById('reviews').innerHTML=window.reviewAll()">Semak semua jawapan</button><button onclick="start()">Cuba lagi</button><div id="reviews"></div>`;window.reviewWrong=()=>review(true);window.reviewAll=()=>review(false);document.getElementById('reviews').innerHTML=review(true);return;}const q=questions[index];el.innerHTML=`<p class="progress">Soalan ${index+1} / 40 • Bab ${q.chapter}: ${escapeHTML(["Ubahan", "Matriks", "Matematik Pengguna: Insurans", "Matematik Pengguna: Percukaian", "Kekongruenan, Pembesaran dan Gabungan Transformasi", "Nisbah dan Graf Fungsi Trigonometri", "Sukatan Serakan Data Terkumpul", "Pemodelan Matematik"][q.chapter-1])}</p><h3>${escapeHTML(q.question)}</h3><div id="choices">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="ans" value="${i}"> ${abc[i]}. ${escapeHTML(o)}</label>`).join('')}</div><button id="next" disabled>${index===39?'Lihat keputusan':'Soalan seterusnya'}</button>`;document.querySelectorAll('input[name=ans]').forEach(e=>e.onchange=()=>document.getElementById('next').disabled=false);document.getElementById('next').onclick=()=>{answers.push(Number(document.querySelector('input[name=ans]:checked').value));index++;render();window.scrollTo(0,0);};}start();</script></body></html>
