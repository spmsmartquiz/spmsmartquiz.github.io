<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matematik Tingkatan 5 — Kertas 1 Set B | SPM Smart Quiz</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#eef4ff;color:#203047;margin:0}header{background:#294e97;color:white;padding:20px;text-align:center}main{max-width:740px;margin:20px auto;padding:0 12px}.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #dce4f0}.option{display:block;border:1px solid #cbd8ec;border-radius:10px;padding:13px;margin:9px 0;cursor:pointer}.option:has(input:checked){background:#e8f0ff;border-color:#294e97}button{background:#294e97;color:white;border:0;border-radius:10px;padding:13px 16px;font-weight:bold;cursor:pointer;margin:7px 5px 7px 0}button:disabled{opacity:.5}.wrong{border-left:4px solid #c64242;background:#fff2f0;padding:13px;margin:12px 0}.right{border-left:4px solid #27936b;background:#edfaf5;padding:13px;margin:12px 0}.muted{color:#667085}.explain{white-space:pre-wrap;line-height:1.6;background:#f3f6fb;padding:12px;border-radius:8px}a{color:#294e97}.progress{font-weight:bold}</style></head><body><header><h2>SPM Smart Quiz</h2><p>Matematik Tingkatan 5 • Kertas 1 • Set B</p></header><main><section class="card"><p>40 soalan objektif • 40 markah • 8 bab • Tiada had masa</p><p class="muted">Soalan latihan asli berasaskan KSSM Tingkatan 5, bukan soalan rasmi SPM. Jawapan dan jalan pengiraan dipaparkan selepas selesai.</p><a href="index.html#matematik5">← Kembali ke menu Matematik Tingkatan 5</a></section><section class="card" id="quiz"></section></main><script>const bank=[{"chapter": 1, "question": "y berubah secara langsung dengan x. Jika y = 16 apabila x = 4, cari y apabila x = 5.", "options": ["16", "24", "28", "20"], "correct": 3, "explanation": "y = kx. Pemalar k = 16/4 = 4. Maka y = 4 × 5 = 20.", "diagram": ""}, {"chapter": 1, "question": "y berubah secara langsung dengan kuasa dua x. Jika y = 64 apabila x = 4, cari y apabila x = 6.", "options": ["24", "140", "144", "148"], "correct": 2, "explanation": "y = kx²; k = 64/16 = 4. Apabila x = 6, y = 4 × 6² = 144.", "diagram": ""}, {"chapter": 1, "question": "y berubah secara songsang dengan x. Jika y = 12 apabila x = 3, cari y apabila x = 6.", "options": ["12", "8", "10", "6"], "correct": 3, "explanation": "y = k/x; k = xy = 3 × 12 = 36. Maka y = 36/6 = 6.", "diagram": ""}, {"chapter": 1, "question": "z berubah secara tercantum dengan x dan y. Jika z = 80 apabila x = 4 dan y = 5, cari z apabila x = 5 dan y = 6.", "options": ["96", "124", "120", "100"], "correct": 2, "explanation": "z = kxy; k = 80/(4 × 5) = 4. Jadi z = 4 × 5 × 6 = 120.", "diagram": ""}, {"chapter": 1, "question": "Diberi y ∝ x dan y = 16 apabila x = 4. Berapakah nilai x apabila y = 28?", "options": ["8", "7", "9", "6"], "correct": 1, "explanation": "k = 16/4 = 4. Daripada 28 = 4x, x = 7.", "diagram": ""}, {"chapter": 2, "question": "Diberi matriks A = [[3, 4], [5, 6]]. Cari jumlah semua unsur pada pepenjuru utama A.", "options": ["8", "9", "10", "11"], "correct": 1, "explanation": "Pepenjuru utama terdiri daripada 3 dan 6. Jumlah = 3+6 = 9.", "diagram": ""}, {"chapter": 2, "question": "Diberi A = [[3, 4], [5, 6]] dan B = [[1, 2], [3, 4]]. Cari unsur baris pertama lajur kedua bagi A + B.", "options": ["5", "8", "6", "7"], "correct": 2, "explanation": "Tambah unsur sepadan: 4 + 2 = 6.", "diagram": ""}, {"chapter": 2, "question": "Jika A = [[3, 4], [5, 6]], cari unsur baris kedua lajur pertama bagi 3A.", "options": ["18", "15", "16", "14"], "correct": 1, "explanation": "Darab setiap unsur A dengan 3. Unsur tersebut = 3 × 5 = 15.", "diagram": ""}, {"chapter": 2, "question": "Cari penentu bagi matriks [[4, 3], [1, 5]].", "options": ["23", "15", "19", "17"], "correct": 3, "explanation": "Penentu = ad − bc = (4 × 5) − (3 × 1) = 17.", "diagram": ""}, {"chapter": 2, "question": "Penyelesaian persamaan matriks [[2, 1], [1, 2]] [[x], [y]] = [[13], [14]] ialah", "options": ["x = 5, y = 4", "x = 4, y = 5", "x = 4, y = 6", "x = 5, y = 5"], "correct": 1, "explanation": "Persamaan: 2x+y=13 dan x+2y=14. Darab persamaan kedua dengan 2, kemudian tolak persamaan pertama: 3y=15, maka y=5. Ganti semula: x=4.", "diagram": ""}, {"chapter": 3, "question": "Premium asas polisi insurans ialah RM500. Jika diskaun tanpa tuntutan (NCD) ialah 20%, cari premium selepas diskaun.", "options": ["RM600", "RM420", "RM400", "RM500"], "correct": 2, "explanation": "Diskaun = 20% × RM500 = RM100. Premium = RM500 − RM100 = RM400.", "diagram": ""}, {"chapter": 3, "question": "Kadar premium ialah RM4 bagi setiap RM1,000 jumlah diinsuranskan. Cari premium bagi jumlah diinsuranskan RM40,000.", "options": ["RM164", "RM160", "RM320", "RM156"], "correct": 1, "explanation": "Bilangan unit RM1,000 = 40000/1,000 = 40. Premium = 40 × RM4 = RM160.", "diagram": ""}, {"chapter": 3, "question": "Satu tuntutan kerosakan dilindungi sepenuhnya tetapi mempunyai deduktibel RM500. Jika kerugian RM3000, berapakah bayaran syarikat insurans?", "options": ["RM2500", "RM500", "RM3500", "RM3000"], "correct": 0, "explanation": "Bayaran insurans = kerugian − deduktibel = RM3000 − RM500 = RM2500.", "diagram": ""}, {"chapter": 3, "question": "Sebuah rumah diinsuranskan sebanyak RM48,000 dan nilai boleh insuransnya RM60,000. Berapakah peratus perlindungan?", "options": ["90%", "80%", "70%", "20%"], "correct": 1, "explanation": "Peratus perlindungan = (48000/60000) × 100% = 80%.", "diagram": ""}, {"chapter": 3, "question": "Premium insurans tahunan ialah RM1440. Berapakah bayaran purata sebulan jika dibahagi sama rata kepada 12 bulan?", "options": ["RM120", "RM110", "RM130", "RM144"], "correct": 0, "explanation": "Bayaran sebulan = RM1440 ÷ 12 = RM120.", "diagram": ""}, {"chapter": 4, "question": "Bagi suatu latihan, kadar cukai pendapatan ialah 5% secara rata atas pendapatan bercukai RM12,000. Berapakah cukai?", "options": ["RM600", "RM6000", "RM700", "RM500"], "correct": 0, "explanation": "Cukai = 5% × RM12000 = RM600. Ini kadar rekaan dalam soalan, bukan jadual cukai sebenar.", "diagram": ""}, {"chapter": 4, "question": "Pendapatan tahunan ialah RM52,000 dan jumlah pelepasan cukai RM11,000. Cari pendapatan bercukai (andaikan tiada potongan lain).", "options": ["RM42000", "RM63000", "RM41000", "RM52000"], "correct": 2, "explanation": "Pendapatan bercukai = pendapatan tahunan − pelepasan = RM52000 − RM11000 = RM41000.", "diagram": ""}, {"chapter": 4, "question": "Sebuah barang berharga RM240 dikenakan cukai jualan 10%. Berapakah harga termasuk cukai?", "options": ["RM274", "RM240", "RM216", "RM264"], "correct": 3, "explanation": "Cukai = 10% × RM240 = RM24. Harga akhir = RM240 + RM24 = RM264.", "diagram": ""}, {"chapter": 4, "question": "Cukai pendapatan yang dikira ialah RM400. Jika rebat cukai yang layak ialah RM100, cari cukai kena dibayar.", "options": ["RM300", "RM500", "RM400", "RM100"], "correct": 0, "explanation": "Cukai kena dibayar = cukai dikira − rebat = RM400 − RM100 = RM300.", "diagram": ""}, {"chapter": 4, "question": "Jumlah cukai taksiran tahunan ialah RM840. Jika dibayar dalam dua ansuran sama banyak, berapakah setiap ansuran?", "options": ["RM420", "RM210", "RM480", "RM840"], "correct": 0, "explanation": "Ansuran = RM840 ÷ 2 = RM420.", "diagram": ""}, {"chapter": 5, "question": "Suatu segi tiga dibesarkan dengan faktor skala 2. Jika panjang sisi asal 4 cm, berapakah panjang sisi imej?", "options": ["4 cm", "16 cm", "6 cm", "8 cm"], "correct": 3, "explanation": "Panjang imej = faktor skala × panjang asal = 2 × 4 = 8 cm.", "diagram": ""}, {"chapter": 5, "question": "Luas suatu bentuk ialah 16 cm². Bentuk itu dibesarkan dengan faktor skala 3. Cari luas imej.", "options": ["144 cm²", "48 cm²", "25 cm²", "153 cm²"], "correct": 0, "explanation": "Luas imej = luas asal × (faktor skala)² = 16 × 3² = 144 cm².", "diagram": ""}, {"chapter": 5, "question": "Titik P(4, 5) ditranslasikan oleh vektor (2, −1). Apakah koordinat imej P′?", "options": ["(6, 4)", "(6, 6)", "(2, 4)", "(4, 5)"], "correct": 0, "explanation": "P′ = (4+2, 5−1) = (6, 4).", "diagram": ""}, {"chapter": 5, "question": "Titik Q(4, 5) dipantulkan pada paksi-y. Apakah imej Q′?", "options": ["(4, -5)", "(5, 4)", "(-4, -5)", "(-4, 5)"], "correct": 3, "explanation": "Pantulan pada paksi-y menukar tanda koordinat x sahaja. Maka Q′ = (-4, 5).", "diagram": ""}, {"chapter": 5, "question": "Titik R(4, 5) diputar 90° lawan arah jam tentang asalan. Cari imej R′.", "options": ["(-5, 4)", "(-4, -5)", "(5, -4)", "(4, -5)"], "correct": 0, "explanation": "Putaran 90° lawan jam: (x,y) → (−y,x). Maka R′ = (-5,4).", "diagram": ""}, {"chapter": 6, "question": "Cari nilai tepat sin 45° bagi latihan Set B.", "options": ["1", "0", "√2/2", "√3/2"], "correct": 2, "explanation": "Berdasarkan sudut khas, sin 45° = √2/2.", "diagram": ""}, {"chapter": 6, "question": "Cari nilai tepat kos 30° bagi latihan Set B.", "options": ["1", "√3/2", "0", "√2/2"], "correct": 1, "explanation": "Berdasarkan sudut khas, kos 30° = √3/2.", "diagram": ""}, {"chapter": 6, "question": "Berapakah amplitud bagi graf y = 4 sin x?", "options": ["5", "8", "3", "4"], "correct": 3, "explanation": "Amplitud bagi y = a sin x ialah |a|. Jadi amplitud = 4.", "diagram": ""}, {"chapter": 6, "question": "Apakah tempoh bagi graf y = sin(3x) dalam darjah?", "options": ["120°", "210°", "150°", "180°"], "correct": 0, "explanation": "Tempoh = 360° ÷ 3 = 120°.", "diagram": ""}, {"chapter": 6, "question": "Graf y = 3 sin x mempunyai nilai maksimum berapa?", "options": ["4", "2", "-3", "3"], "correct": 3, "explanation": "Nilai maksimum sin x ialah 1. Maka nilai maksimum y = 3 × 1 = 3.", "diagram": ""}, {"chapter": 7, "question": "Jadual kekerapan mempunyai kekerapan 2, 3, 4 dan 7. Berapakah jumlah bilangan data?", "options": ["16", "15", "17", "18"], "correct": 0, "explanation": "Jumlah kekerapan = 2 + 3 + 4 + 7 = 16.", "diagram": ""}, {"chapter": 7, "question": "Bagi selang kelas 14–24, cari titik tengah kelas.", "options": ["19", "14", "24", "20"], "correct": 0, "explanation": "Titik tengah = (14+24)/2 = 19.", "diagram": ""}, {"chapter": 7, "question": "Bagi kelas 20–29 (data integer), apakah sempadan bawah kelas?", "options": ["19", "20", "19.5", "20.5"], "correct": 2, "explanation": "Sempadan bawah = had bawah − 0.5 = 20 − 0.5 = 19.5.", "diagram": ""}, {"chapter": 7, "question": "Bagi satu kelas, kekerapan ialah 5 dan titik tengah ialah 25. Cari hasil darab fx.", "options": ["125", "150", "130", "30"], "correct": 0, "explanation": "fx = f × x = 5 × 25 = 125.", "diagram": ""}, {"chapter": 7, "question": "Empat titik tengah kelas ialah 12, 14, 16, 18 dengan kekerapan sama. Cari min anggaran.", "options": ["14", "17", "16", "15"], "correct": 3, "explanation": "Min anggaran = jumlah fx / jumlah f = (12 + 14 + 16 + 18)/4 = 15.", "diagram": ""}, {"chapter": 8, "question": "Suatu model linear ialah y = 3x + 2. Ramalkan y apabila x = 4.", "options": ["17", "16", "14", "12"], "correct": 2, "explanation": "Gantikan x=4: y = 3(4)+2 = 14.", "diagram": ""}, {"chapter": 8, "question": "Model kos C = 100 + 20n (RM) digunakan bagi n unit. Cari C apabila n = 6.", "options": ["RM120", "RM240", "RM200", "RM220"], "correct": 3, "explanation": "C = 100 + 20(6) = RM220.", "diagram": ""}, {"chapter": 8, "question": "Model y = 2x² digunakan untuk menganggar suatu kuantiti. Cari y apabila x = 4.", "options": ["32", "8", "16", "34"], "correct": 0, "explanation": "y = 2(4)² = 2 × 16 = 32.", "diagram": ""}, {"chapter": 8, "question": "Suatu populasi bermula dengan 120 dan meningkat 10% dalam satu tempoh. Anggarkan populasi selepas satu tempoh.", "options": ["108", "120", "132", "144"], "correct": 2, "explanation": "Model pertumbuhan satu tempoh: P = 120(1+0.10) = 132.", "diagram": ""}, {"chapter": 8, "question": "Jarak d (km) dimodelkan oleh d = 5t + 10. Jika t = 4 jam, cari d.", "options": ["25 km", "35 km", "20 km", "30 km"], "correct": 3, "explanation": "d = 5(4)+10 = 30 km.", "diagram": ""}];let questions=[],index=0,answers=[];const abc='ABCD';function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}function start(){questions=shuffle(bank.map(q=>{const correctText=q.options[q.correct];const opts=shuffle(q.options);return {...q,options:opts,correct:opts.indexOf(correctText)};}));index=0;answers=[];render();}function render(){const el=document.getElementById('quiz');if(index>=questions.length){const score=questions.reduce((n,q,i)=>n+(answers[i]===q.correct?1:0),0);const review=(onlyWrong)=>questions.map((q,i)=>({q,i})).filter(o=>!onlyWrong||answers[o.i]!==o.q.correct).map(({q,i})=>`<article class="${answers[i]===q.correct?'right':'wrong'}"><b>Soalan ${i+1} — Bab ${q.chapter}: ${escapeHTML(["Ubahan", "Matriks", "Matematik Pengguna: Insurans", "Matematik Pengguna: Percukaian", "Kekongruenan, Pembesaran dan Gabungan Transformasi", "Nisbah dan Graf Fungsi Trigonometri", "Sukatan Serakan Data Terkumpul", "Pemodelan Matematik"][q.chapter-1])}</b><p>${escapeHTML(q.question)}</p><p>Jawapan anda: ${abc[answers[i]]}. ${escapeHTML(q.options[answers[i]])}</p><p><b>Jawapan betul: ${abc[q.correct]}. ${escapeHTML(q.options[q.correct])}</b></p><div class="explain"><b>Jalan pengiraan / penerangan:</b>
${escapeHTML(q.explanation)}</div></article>`).join('')||'<p>Tahniah, semua jawapan betul!</p>';el.innerHTML=`<h2>Keputusan: ${score}/40 (${(score/40*100).toFixed(1)}%)</h2><p>Semakan jawapan tersedia selepas cubaan pertama.</p><button onclick="document.getElementById('reviews').innerHTML=window.reviewWrong()">Lihat jawapan salah</button><button onclick="document.getElementById('reviews').innerHTML=window.reviewAll()">Semak semua jawapan</button><button onclick="start()">Cuba lagi</button><div id="reviews"></div>`;window.reviewWrong=()=>review(true);window.reviewAll=()=>review(false);document.getElementById('reviews').innerHTML=review(true);return;}const q=questions[index];el.innerHTML=`<p class="progress">Soalan ${index+1} / 40 • Bab ${q.chapter}: ${escapeHTML(["Ubahan", "Matriks", "Matematik Pengguna: Insurans", "Matematik Pengguna: Percukaian", "Kekongruenan, Pembesaran dan Gabungan Transformasi", "Nisbah dan Graf Fungsi Trigonometri", "Sukatan Serakan Data Terkumpul", "Pemodelan Matematik"][q.chapter-1])}</p><h3>${escapeHTML(q.question)}</h3><div id="choices">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="ans" value="${i}"> ${abc[i]}. ${escapeHTML(o)}</label>`).join('')}</div><button id="next" disabled>${index===39?'Lihat keputusan':'Soalan seterusnya'}</button>`;document.querySelectorAll('input[name=ans]').forEach(e=>e.onchange=()=>document.getElementById('next').disabled=false);document.getElementById('next').onclick=()=>{answers.push(Number(document.querySelector('input[name=ans]:checked').value));index++;render();window.scrollTo(0,0);};}start();</script></body></html>
